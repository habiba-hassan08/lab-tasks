<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-card">
        <h1>My To-Do List</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>

        <div class="task-input">
            <input type="text" id="taskInput" placeholder="Enter a task..." aria-label="Task description">
            <button id="addButton">Add Task</button>
        </div>

        <p id="message" class="message" aria-live="polite"></p>
        <ul id="taskList"></ul>
        <p id="emptyMessage" class="empty-message">No tasks yet. Add your first task!</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
